# Dependabot — keep pinned GitHub Actions current.
# Third-party actions are SHA-pinned across the estate. Without Dependabot the
# pins decay; with it, PRs land weekly to bump SHAs that can be reviewed
# against the action's release notes.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: "chore(ci)"
      include: scope
