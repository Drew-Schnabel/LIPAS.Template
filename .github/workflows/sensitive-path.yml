name: Sensitive Path Guard

# If a PR touches sensitive paths (CI, auth, migrations, lockfiles, etc.),
# add a "needs-careful-review" label and post a notice. Especially useful for
# AI PRs that might edit their own CI or dependencies.
# Tune the SENSITIVE_PATHS glob list below.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  path-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check sensitive paths
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            // Simple prefix/suffix matchers. Adjust to your repo layout.
            const sensitive = [
              '.github/workflows/',
              '.github/actions/',
              'Dockerfile',
              'docker-compose',
              'package-lock.json',
              'yarn.lock',
              'pnpm-lock.yaml',
              'go.sum',
              'requirements.txt',
              'poetry.lock',
              'migrations/',
              'auth',
              'secrets',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });

            const hits = files
              .map(f => f.filename)
              .filter(name => sensitive.some(s => name.includes(s)));

            const LABEL = 'needs-careful-review';
            const hasLabel = (pr.labels || []).some(l => l.name === LABEL);

            if (hits.length > 0 && !hasLabel) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: [LABEL],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: '🔒 This PR modifies sensitive paths and needs careful review:\n' +
                      hits.map(h => `- \`${h}\``).join('\n'),
              });
            }
