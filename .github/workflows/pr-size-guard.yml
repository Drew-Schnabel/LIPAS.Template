name: PR Size Guard

# Flags large PRs so oversized AI changes get extra scrutiny or a split.
# Adds a "size/large" label and posts a warning when thresholds are exceeded.
# Tune MAX_FILES / MAX_LINES below.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

env:
  MAX_FILES: "40"
  MAX_LINES: "800"   # additions + deletions

jobs:
  size-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const maxFiles = parseInt(process.env.MAX_FILES, 10);
            const maxLines = parseInt(process.env.MAX_LINES, 10);

            const changedFiles = pr.changed_files;
            const changedLines = (pr.additions || 0) + (pr.deletions || 0);
            const tooBig = changedFiles > maxFiles || changedLines > maxLines;

            const LABEL = 'size/large';
            const hasLabel = (pr.labels || []).some(l => l.name === LABEL);

            if (tooBig && !hasLabel) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: [LABEL],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `⚠️ **Large PR**: ${changedFiles} files / ${changedLines} lines changed ` +
                      `(limits: ${maxFiles} files, ${maxLines} lines). ` +
                      `Consider splitting this into smaller, easier-to-review PRs.`,
              });
            } else if (!tooBig && hasLabel) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: LABEL,
                });
              } catch (e) { core.info(`Could not remove label: ${e.message}`); }
            }
