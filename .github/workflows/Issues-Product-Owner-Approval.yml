name: PO decision
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: po-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'drew-schnabel-bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark pending PO review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --add-label 'Pending Product Owner Review'

  decide:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type != 'Bot' &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == 'drew-schnabel-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          ACTOR: ${{ github.event.comment.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gate() { echo "::notice::PO gate: $1"; echo "- PO gate: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          CMD=$(echo "$BODY" | head -1 | tr '[:upper:]' '[:lower:]' | xargs)
          case "$CMD" in "/approve"|"/reject"*) ;; *) gate "no command in first line: '$CMD'" ;; esac
          tr -d '\r' < ProductOwners.md | grep -Eqix "@?${ACTOR}" || gate "@${ACTOR} not in ProductOwners.md"
          gh issue view "$ISSUE" --json labels -q '.labels[].name' \
            | grep -qxF 'Pending Product Owner Review' || gate "issue #${ISSUE} not in Pending state"
          if [ "$CMD" = "/approve" ]; then
            gh issue edit "$ISSUE" \
              --remove-label 'Pending Product Owner Review' \
              --add-label 'Product Owner Approved'
            gh issue comment "$ISSUE" --body "✅ Approved by @${ACTOR}"
          else
            REASON=$(echo "$BODY" | sed 's|^/reject||I' | xargs)
            gh issue edit "$ISSUE" \
              --remove-label 'Pending Product Owner Review' \
              --add-label 'Product Owner Rejected'
            gh issue comment "$ISSUE" --body "❌ Rejected by @${ACTOR}<br>**Reason:** ${REASON:-none given}"
          fi