# Assigns a new PR to the users listed in .github/CODEOWNERS.
#
# CODEOWNERS drives review *requests* natively, which is not the same as
# assignment — an assigned PR shows in "Assigned to you" and survives a
# dismissed review. This closes that gap.
#
# CODEOWNERS is read from the BASE branch, never the PR head: this workflow
# runs as pull_request_target with write scope, so honouring a head-supplied
# CODEOWNERS would let any PR assign itself to anyone.

name: Assign CODEOWNERS

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: assign-codeowners-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    name: Assign code owners
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out CODEOWNERS from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/CODEOWNERS
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Assign owners
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/CODEOWNERS';

            if (!fs.existsSync(path)) {
              core.info('No .github/CODEOWNERS on the base branch; nothing to assign.');
              return;
            }

            // Collect every @mention across all rules. Path-precision is not
            // useful here: a PR usually spans several rules, and assigning the
            // union is the intent ("assign it to the code owners").
            const owners = new Set();
            for (const raw of fs.readFileSync(path, 'utf8').split('\n')) {
              const line = raw.replace(/#.*$/, '').trim();
              if (!line) continue;
              for (const token of line.split(/\s+/).slice(1)) {
                // Teams (@org/team) and raw emails cannot be assignees.
                if (token.startsWith('@') && !token.includes('/')) {
                  owners.add(token.slice(1));
                }
              }
            }

            if (owners.size === 0) {
              core.info('CODEOWNERS lists no assignable users.');
              return;
            }

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const already = new Set((pr.assignees || []).map(a => a.login));
            // GitHub caps assignees at 10 and silently drops non-collaborators.
            const toAdd = [...owners].filter(u => !already.has(u)).slice(0, 10);

            if (toAdd.length === 0) {
              core.info('Code owners are already assigned.');
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: pr.number, assignees: toAdd,
              });
              core.info(`Assigned: ${toAdd.join(', ')}`);
            } catch (e) {
              core.info(`Could not assign ${toAdd.join(', ')}: ${e.message}`);
            }
